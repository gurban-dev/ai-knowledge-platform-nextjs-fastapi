name: ai-knowledge-platform

services:
  postgres:
    # pgvector image ships Postgres 16 with the vector extension preinstalled
    image: pgvector/pgvector:pg16
    container_name: akp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: akp
      POSTGRES_PASSWORD: akp_dev_password
      POSTGRES_DB: akp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akp -d akp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: akp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["python"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: akp-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://akp:akp_dev_password@postgres:5432/akp?schema=public
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
      API_PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    profiles: ["python"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: akp-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://akp:akp_dev_password@postgres:5432/akp?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
