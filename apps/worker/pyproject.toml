[project]
name = "akp-worker"
version = "0.1.0"
description = "arq background workers — ingest, webhooks, retention"
requires-python = ">=3.12"
dependencies = [
  "akp-core",
  "akp-config",
  "akp-db",
  "akp-observability",
  "arq>=0.26.1",
  "redis>=5.2.0",
  "httpx>=0.28.0",
]

[project.scripts]
akp-worker = "akp_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akp_worker"]
