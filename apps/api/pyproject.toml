[project]
name = "akp-api"
version = "0.1.0"
description = "FastAPI REST API — contract-compatible with the former Fastify API"
requires-python = ">=3.12"
dependencies = [
  "akp-core",
  "akp-config",
  "akp-db",
  "akp-observability",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "gunicorn>=23.0.0",
  "pydantic>=2.10.0",
  "redis>=5.2.0",
  "httpx>=0.28.0",
  "PyJWT[crypto]>=2.10.0",
  "authlib>=1.4.0",
  "argon2-cffi>=23.1.0",
  "pyotp>=2.9.0",
  "prometheus-client>=0.21.0",
  "email-validator>=2.3.0",
]

[project.scripts]
akp-api = "akp_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akp_api"]
