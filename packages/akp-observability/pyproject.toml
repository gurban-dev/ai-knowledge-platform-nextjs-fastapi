[project]
name = "akp-observability"
version = "0.1.0"
description = "Structured logging and metrics helpers"
requires-python = ">=3.12"
dependencies = [
  "akp-config",
  "structlog>=24.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akp_observability"]
